site_name: MkDocs Custom Theme
site_description: Кастомная тема для MkDocs на чистом HTML, CSS и JavaScript. Адаптивный дизайн, быстрая загрузка, типографика и минификация без внешних зависимостей.
site_author: Yurii Korolev
site_url: https://yourusername.github.io/mkdocs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: indigo
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono

nav:
  - Home: index.md
  - About: about.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/KoroLev2512/mkdocs

extra_css:
  - assets/styles.css
extra_javascript:
  - assets/script.js