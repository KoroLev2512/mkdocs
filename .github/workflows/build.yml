name: Build Frontend and MkDocs

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-frontend:
    name: Build Frontend Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Improve typography (Typograf)
        run: npm run typograf

      - name: Build CSS with PostCSS
        run: npm run build:css

      - name: Minify JavaScript
        run: npm run minify:js

      - name: Minify HTML files
        run: npm run minify:html
        continue-on-error: true

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-assets
          path: |
            docs/assets/*.min.*
            docs/*.min.html
          retention-days: 1

  build-mkdocs:
    name: Build MkDocs Site
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install MkDocs and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-assets

      - name: Replace assets with minified versions
        run: |
          if [ -f docs/assets/styles.min.css ]; then
            cp docs/assets/styles.min.css docs/assets/styles.css
          fi
          if [ -f docs/assets/script.min.js ]; then
            cp docs/assets/script.min.js docs/assets/script.js
          fi

      - name: Build MkDocs site
        run: mkdocs build --strict

      - name: Upload site artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mkdocs-site
          path: ./site
          retention-days: 1

