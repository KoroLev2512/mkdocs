name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate HTML files
        run: npm run lint:html || true
        continue-on-error: true

      - name: Improve typography (Typograf)
        run: npm run typograf

      - name: Build CSS with PostCSS
        run: npm run build:css

      - name: Minify JavaScript
        run: npm run minify:js

      - name: Replace assets with minified versions
        run: |
          if [ -f docs/assets/styles.min.css ]; then
            cp docs/assets/styles.min.css docs/assets/styles.css
          fi
          if [ -f docs/assets/script.min.js ]; then
            cp docs/assets/script.min.js docs/assets/script.js
          fi

      - name: Build MkDocs site
        run: mkdocs build --strict

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

